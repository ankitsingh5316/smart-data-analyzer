<app-auth-layout>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (status()) {
      <div class="banner" [class.info]="statusTone() === 'info'" [class.error]="statusTone() === 'error'" [class.success]="statusTone() === 'success'">
        {{ status() }}
      </div>
    }
    <h1>Sign in</h1>
    <p class="muted" style="margin: 8px 0 24px">Use the account that owns your datasets.</p>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" [class]="message('email') ? 'bad' : form.controls.email.valid && form.controls.email.dirty ? 'ok' : ''" />
    </label>
    @if (message('email')) { <p class="field-error">{{ message('email') }}</p> }
    <label class="field">
      <span>Password</span>
      <div class="password-row">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button class="button secondary" type="button" (click)="showPassword.set(!showPassword())">{{ showPassword() ? 'Hide' : 'Show' }}</button>
      </div>
    </label>
    @if (message('password')) { <p class="field-error">{{ message('password') }}</p> }
    <button class="button primary full" type="submit" [disabled]="submitting()">{{ submitting() ? 'Signing in…' : 'Sign in' }}</button>
    <p style="margin-top: 16px"><a routerLink="/forgot-password">Forgot password</a></p>
    <p class="muted" style="margin-top: 8px">New here? <a routerLink="/signup">Create an account</a></p>
  </form>
</app-auth-layout>
